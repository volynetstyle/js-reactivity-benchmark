# cellx lists its own benchmark libraries as exact peers. Each adapter here
# deliberately measures the version pinned in package.json; workers verify
# that no other library version is bundled.
peerDependencyRules:
  allowedVersions:
    "cellx@2.4.0>@preact/signals-core": "1.14.5"
    "cellx@2.4.0>@reatom/core": "1001.3.0"
    "cellx@2.4.0>alien-signals": "3.2.1"
    "cellx@2.4.0>mobx": "7.1.5"
    "cellx@2.4.0>mol_wire_lib": "1.0.1839"
    "cellx@2.4.0>solid-js": "1.9.18"

packageExtensions:
  "rescript-signals@3.2.0":
    dependencies:
      "@rescript/runtime": "12.3.1"

onlyBuiltDependencies:
  - esbuild
