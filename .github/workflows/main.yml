name: CI

# Compatibility, not performance: the suite must install, type-check, build
# and run on every supported Node.js line. Published measurements use exactly
# the release in .nvmrc (see benchmarks.yml); the "pinned" entry checks that
# release here too, so the Benchmarks workflow only starts after it passes.

on: [push, pull_request]

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26", "pinned"]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node != 'pinned' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'pinned' && '.nvmrc' || '' }}
          cache: "pnpm"

      - name: Verify the pinned runtime
        if: matrix.node == 'pinned'
        run: node scripts/check-runtime.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run test
        run: pnpm test

      - name: Check source types
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

      - name: Verify isolated benchmark runner
        run: pnpm bench:smoke

      - name: Verify standalone production distribution
        run: pnpm verify:production
