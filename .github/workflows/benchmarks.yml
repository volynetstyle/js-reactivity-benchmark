name: Benchmarks

# Measurement runs in parallel CI shards. Shards split scenarios, never
# frameworks: every framework of a scenario runs on the same runner VM, because
# GitHub assigns different CPU models to different jobs. Machine rounds
# measure every shard again on other VMs, and process rounds repeat every row
# in fresh processes on each VM, so the merged results separate within-process,
# between-process and between-machine variance. Publication runs default to
# 3 process rounds x 3 machine rounds.
#
# This workflow measures on exactly the Node.js release in .nvmrc. Compatibility
# with other Node.js lines is the CI workflow's job, never mixed in here.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      framework:
        description: "Optional framework name(s) to benchmark, e.g. reflex"
        required: false
        type: string
        default: ""
      profile:
        description: "quick for medians; tails for 1000 untrimmed samples per uncapped row"
        required: false
        type: choice
        options: [quick, tails]
        default: quick
      rounds:
        description: "Fresh-process repetitions per row within one VM"
        required: false
        type: string
        default: "3"
      shards:
        description: "Parallel scenario shards (one VM each)"
        required: false
        type: string
        default: "8"
      machine_rounds:
        description: "Independent VMs per shard; >1 reports the median across machines and their range"
        required: false
        type: string
        default: "3"

permissions:
  contents: write

concurrency:
  group: benchmarks-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  plan:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    # The effective settings, so automatic runs and the archived metadata use
    # the same values (workflow_run events carry no inputs).
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      rounds: ${{ steps.plan.outputs.rounds }}
      machine_rounds: ${{ steps.plan.outputs.machine_rounds }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - name: Plan shards
        id: plan
        env:
          SHARDS: ${{ github.event.inputs.shards || '8' }}
          ROUNDS: ${{ github.event.inputs.rounds || '3' }}
          MACHINE_ROUNDS: ${{ github.event.inputs.machine_rounds || '3' }}
          PROFILE: ${{ github.event.inputs.profile || 'quick' }}
        run: |
          node -e '
            const shards = Number(process.env.SHARDS);
            const rounds = Number(process.env.ROUNDS);
            const machineRounds = Number(process.env.MACHINE_ROUNDS);
            if (!Number.isInteger(shards) || shards < 1 || shards > 32) throw new Error("shards must be 1..32");
            if (!Number.isInteger(rounds) || rounds < 1 || rounds > 10) throw new Error("rounds must be 1..10");
            if (!Number.isInteger(machineRounds) || machineRounds < 1 || machineRounds > 5) throw new Error("machine_rounds must be 1..5");
            const include = [];
            for (let round = 1; round <= machineRounds; round++)
              for (let shard = 1; shard <= shards; shard++) include.push({ round, shard });
            console.log("matrix=" + JSON.stringify({ include }));
            console.log("shards=" + shards);
            console.log("rounds=" + rounds);
            console.log("machine_rounds=" + machineRounds);
            console.log("profile=" + process.env.PROFILE);
          ' >> "$GITHUB_OUTPUT"

  measure:
    name: Measure shard ${{ matrix.shard }} (machine round ${{ matrix.round }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # A partial set of shards cannot be published; stop spending runners.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.TESTED_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keep .nvmrc at an exact major.minor.patch version: a major-only
          # range can resolve to different cached releases on shard runners.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify the pinned runtime
        run: node scripts/check-runtime.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build
        run: pnpm build

      - name: Run shard
        env:
          BENCH_FRAMEWORK: ${{ github.event.inputs.framework }}
          BENCH_PROFILE: ${{ needs.plan.outputs.profile }}
          BENCH_ROUNDS: ${{ needs.plan.outputs.rounds }}
          BENCH_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
          BENCH_MACHINE_ROUND: ${{ matrix.round }}
          BENCH_ASSERT_NO_CONSOLE: "1"
          # A library that crashes or runs out of memory is published as a
          # FAILED row (not ranked) instead of blocking the whole leaderboard.
          BENCH_ALLOW_FAILURES: "1"
          BENCH_SOURCE_COMMIT: ${{ env.TESTED_SHA }}
          BENCH_SAMPLES_FILE: shard-out/shard-${{ matrix.round }}-${{ matrix.shard }}.samples.json
        run: |
          mkdir -p shard-out
          node --expose-gc dist/index.js > "shard-out/shard-${{ matrix.round }}-${{ matrix.shard }}.log"

      - name: Upload shard output
        uses: actions/upload-artifact@v7
        with:
          name: bench-shard-${{ matrix.round }}-${{ matrix.shard }}
          path: shard-out/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [plan, measure]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.TESTED_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download shard outputs
        uses: actions/download-artifact@v8
        with:
          pattern: bench-shard-*
          merge-multiple: true
          path: shard-out

      # Refuses shards from different commits, lockfiles, bundles, runtimes or
      # sampling policies, and incomplete or overlapping scenario coverage.
      - name: Merge shards and render the results page
        run: node scripts/merge-shards.mjs shard-out

      # Every shard measured on the same Node.js/V8 (enforced by the merge);
      # this checks that it is the release pinned in .nvmrc.
      - name: Verify the published runtime
        run: node scripts/check-runtime.mjs bench-results/latest.samples.json

      - name: Archive benchmark output
        id: archive
        shell: bash
        run: |
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          short_sha="${TESTED_SHA::7}"
          archive_dir="bench-results/history"
          archive_log="$archive_dir/${timestamp}-${short_sha}.log"
          archive_meta="$archive_dir/${timestamp}-${short_sha}.json"
          archive_samples="$archive_dir/${timestamp}-${short_sha}.samples.json"

          mkdir -p "$archive_dir"
          cp bench-results/latest.log "$archive_log"
          cp bench-results/latest.samples.json "$archive_samples"

          cat > "$archive_meta" <<EOF
          {
            "commit": "${TESTED_SHA}",
            "shortCommit": "${short_sha}",
            "ref": "${TARGET_BRANCH}",
            "runId": "${GITHUB_RUN_ID}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "generatedAtUtc": "${timestamp}",
            "logPath": "${archive_log}",
            "samplesPath": "${archive_samples}",
            "profile": "${{ needs.plan.outputs.profile }}",
            "rounds": "${{ needs.plan.outputs.rounds }}",
            "shards": "${{ needs.plan.outputs.shards }}",
            "machineRounds": "${{ needs.plan.outputs.machine_rounds }}"
          }
          EOF

          {
            echo "archive_log=$archive_log"
            echo "archive_meta=$archive_meta"
            echo "archive_samples=$archive_samples"
            echo "timestamp=$timestamp"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ steps.archive.outputs.timestamp }}-${{ steps.archive.outputs.short_sha }}
          path: |
            bench-results/latest.log
            bench-results/latest.samples.json
            ${{ steps.archive.outputs.archive_log }}
            ${{ steps.archive.outputs.archive_meta }}
            ${{ steps.archive.outputs.archive_samples }}
            index.html

      - name: Check that the tested commit is still the branch head
        id: publication
        run: |
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_head" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # The tested SHA was checked out detached; it is still the branch head,
      # so attach the branch there before committing (required by v6+).
      - name: Attach the branch at the tested commit
        if: steps.publication.outputs.current == 'true'
        run: git checkout -B "$TARGET_BRANCH"

      - name: Commit benchmark results
        if: steps.publication.outputs.current == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update benchmark results [skip ci]"
          file_pattern: bench-results index.html
          branch: ${{ env.TARGET_BRANCH }}
